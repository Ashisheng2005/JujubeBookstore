<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JujubeBookstore · 漫画 / 资源控制台</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e2230; --line:#2b3140;
    --fg:#e6e9ef; --dim:#8b93a7; --accent:#7c9ef8; --ok:#3ecf8e; --warn:#f5a524; --err:#f2555a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);
         position:sticky;top:0;background:rgba(15,17,21,.92);backdrop-filter:blur(6px);z-index:5}
  h1{font-size:16px;margin:0;letter-spacing:0}
  .badge{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .badge.ok{color:var(--ok);border-color:#1f4d3a}
  .badge.warn{color:var(--warn);border-color:#4d3d1f}
  nav{display:flex;gap:8px;padding:12px 18px 0}
  nav button{background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:8px;
             padding:7px 14px;cursor:pointer;font-size:13px}
  nav button.active{background:var(--panel2);color:var(--fg);border-color:#3b4560}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;
            border-bottom:1px solid var(--line)}
  select,input,button{background:var(--panel);color:var(--fg);border:1px solid var(--line);
                      border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
  input#q{flex:1;min-width:200px}
  button.primary{background:#2b3a63;border-color:#3b4f85;color:#cfe0ff;cursor:pointer}
  button.primary:hover{background:#33456f}
  main{display:grid;grid-template-columns:1fr 380px;gap:0;align-items:start}
  @media(max-width:1000px){main{grid-template-columns:1fr}}
  .col{padding:16px 18px;min-height:60vh}
  .col.left{border-right:1px solid var(--line)}
  .muted{color:var(--dim);font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;
        transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-2px);border-color:#3b4560}
  .card img{width:100%;height:176px;object-fit:cover;background:#0b0d11;display:block}
  .card .t{padding:8px 9px;font-size:12.5px;line-height:1.35;height:56px;overflow:hidden}
  .card .s{padding:0 9px 9px;font-size:11.5px;color:var(--dim)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .chip{font-size:11px;padding:1px 7px;border-radius:999px;background:#232838;color:#a9b3cc}
  h2{font-size:15px;margin:0 0 10px}
  h3{font-size:13px;margin:16px 0 8px;color:var(--dim);font-weight:600}
  .row{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid #21262f}
  .row .k{color:var(--dim);font-size:12px;min-width:64px}
  .chap{display:inline-block;margin:3px 6px 3px 0;padding:4px 9px;background:var(--panel2);
        border:1px solid var(--line);border-radius:7px;font-size:12.5px;cursor:pointer;color:#cdd6ea}
  .chap:hover{border-color:#3b4560;color:#fff}
  .pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .pages img{width:100%;border-radius:6px;background:#0b0d11;min-height:80px}
  .res{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:10px}
  .res .title{font-size:13.5px;margin-bottom:5px;word-break:break-all}
  .res .meta{font-size:12px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
  .res .acts{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  a{color:var(--accent);text-decoration:none;word-break:break-all}
  a:hover{text-decoration:underline}
  code{background:#12151c;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
  .side{padding:16px 18px;border-left:1px solid var(--line);background:#12141a;min-height:60vh}
  .side h2{display:flex;justify-content:space-between;align-items:center}
  #log{font:11.5px/1.5 ui-monospace,Consolas,monospace;max-height:70vh;overflow:auto}
  #log div{padding:3px 0;border-bottom:1px dashed #1e232c;word-break:break-all}
  .s2{color:var(--ok)} .s4{color:var(--warn)} .s5{color:var(--err)}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid #3b4560;border-top-color:#cfe0ff;
           border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
  details{margin-top:6px}
  summary{cursor:pointer;color:var(--dim);font-size:12px}
  [hidden]{display:none!important}
  button{cursor:pointer} button:disabled{opacity:.45;cursor:default}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .download-layout{display:grid;grid-template-columns:190px minmax(0,1fr) 260px;min-height:60vh}
  .download-groups{padding:16px 12px;border-right:1px solid var(--line)}
  .download-groups button{width:100%;text-align:left;margin-bottom:5px;overflow-wrap:anywhere}
  .download-groups button.selected{border-color:var(--ok);color:var(--ok)}
  .download-groups svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:middle}
  .download-main{padding:16px 18px;min-width:0}
  .download-detail{padding:16px;border-left:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
  .download-summary,.download-toolbar,.download-actions,.pagination{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .download-summary span{padding:4px 0;margin-right:14px;color:var(--dim)}
  .download-summary strong{color:var(--fg);font-variant-numeric:tabular-nums}
  .download-toolbar select{max-width:100%}
  .table-scroll{overflow:auto}
  .download-table{width:100%;border-collapse:collapse;font-size:12px;min-width:670px}
  .download-table th{color:var(--dim);text-align:left;font-weight:500;padding:9px 6px;border-bottom:1px solid var(--line)}
  .download-table td{padding:11px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .download-table tr.selected{background:#192620}
  .download-table .task-title{max-width:220px;overflow-wrap:anywhere}
  .task-link{padding:0;background:none;border:0;text-align:left;color:var(--fg);font-size:12px;max-width:100%;overflow-wrap:anywhere}
  .download-table progress{width:100px;height:6px;accent-color:var(--ok);display:block;margin-bottom:4px}
  .icon-button{width:30px;height:30px;padding:5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .icon-button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .download-actions{gap:5px;margin:0}
  .download-error{color:var(--err);overflow-wrap:anywhere;margin-bottom:10px}
  .detail-files{list-style:none;padding:0;max-height:55vh;overflow:auto}
  .detail-files li{padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
  dialog{color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;width:440px;max-width:calc(100vw - 24px);max-height:85vh;overflow:auto}
  dialog::backdrop{background:#0009}
  dialog label{display:block;margin:12px 0 5px}
  dialog input,dialog select,dialog textarea{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:8px;font:inherit}
  dialog .dialog-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  dialog .preview-list{max-height:180px;overflow:auto;font-size:12px;margin-top:12px}
  @media(max-width:1200px){.download-layout{grid-template-columns:170px minmax(0,1fr)}.download-detail{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
  @media(max-width:620px){header{flex-wrap:wrap;gap:7px;padding:10px 12px}nav{flex-wrap:wrap;padding-left:12px}.download-layout{grid-template-columns:minmax(0,1fr)}.download-groups{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}.download-groups h2{width:100%}.download-groups button{width:auto;max-width:100%;margin:0}.download-main{padding:12px}.download-detail{grid-column:auto}.download-toolbar{gap:6px}.col,.side{padding:12px}.row{flex-wrap:wrap}}
  @media(max-width:620px){
    .download-table{display:block;min-width:0}.download-table thead{display:none}.download-table tbody{display:block}
    .download-table tr{display:grid;grid-template-columns:22px minmax(0,1fr) 90px;padding:10px 0;border-bottom:1px solid var(--line)}
    .download-table td{border:0;padding:4px;min-width:0}
    .download-table td:nth-child(1){grid-column:1;grid-row:1/5}
    .download-table td:nth-child(2){grid-column:2/4;grid-row:1;max-width:none}
    .download-table td:nth-child(3){grid-column:2;grid-row:2;overflow-wrap:anywhere;color:var(--dim)}
    .download-table td:nth-child(4){grid-column:3;grid-row:2}
    .download-table td:nth-child(5){grid-column:2;grid-row:3}
    .download-table td:nth-child(6){grid-column:3;grid-row:3}
    .download-table td:nth-child(7){grid-column:2/4;grid-row:4}
    .download-table progress{width:100%;max-width:180px}
  }
</style>
</head>
<body>
<header>
  <h1>JujubeBookstore</h1>
  <span class="badge" id="status">连接中…</span>
  <span class="badge" id="proxybadge">代理 ?</span>
  <span class="muted" id="hint"></span>
</header>

<nav>
  <button data-mode="comic" class="active">漫画源</button>
  <button data-mode="resource">资源源（BT/磁力）</button>
  <button data-mode="downloads">下载管理</button>
</nav>

<div class="controls" id="search-controls">
  <select id="source"></select>
  <select id="category" style="display:none"></select>
  <input id="q" placeholder="关键词，例如：海贼王 / 火影" autocomplete="off">
  <label class="muted">页 <input id="page" type="number" value="1" min="1" style="width:62px"></label>
  <button class="primary" id="go">搜索</button>
  <button id="latest">最近更新</button>
</div>

<main id="browse-main">
  <div class="col left">
    <div id="results"><p class="muted">选择源与模式，然后搜索。</p></div>
  </div>
  <aside class="side">
    <h2>请求日志 <button id="clearlog" style="font-size:11px;padding:2px 8px">清空</button></h2>
    <div id="log"></div>
  </aside>
</main>

<section id="downloads-view" class="download-layout" hidden>
  <aside class="download-groups"><h2>下载分组</h2><div id="download-groups"></div></aside>
  <div class="download-main">
    <div class="download-summary" id="download-summary"></div>
    <div class="download-toolbar">
      <select id="download-status" aria-label="任务状态"><option value="">全部状态</option><option value="queued">排队中</option><option value="downloading">下载中</option><option value="paused">已暂停</option><option value="completed">已完成</option><option value="failed">失败</option><option value="canceled">已取消</option></select>
      <select id="download-type" aria-label="任务类型"><option value="">全部类型</option><option value="comic_chapter">漫画章节</option><option value="torrent">种子文件</option></select>
      <button id="download-refresh" class="icon-button" title="刷新" aria-label="刷新">↻</button>
      <span id="download-connection" class="muted">连接中</span>
    </div>
    <div class="download-toolbar" id="bulk-actions"></div>
    <div id="download-message" role="status" class="download-error"></div>
    <div class="table-scroll"><table class="download-table"><thead><tr><th><input type="checkbox" id="select-all-tasks" aria-label="选择本页任务"></th><th>标题</th><th>分组</th><th>状态</th><th>进度</th><th>速度 / ETA</th><th>操作</th></tr></thead><tbody id="download-rows"></tbody></table></div>
    <div class="pagination" style="margin-top:12px"><button id="download-prev" aria-label="上一页">←</button><span id="download-page" class="muted"></span><button id="download-next" aria-label="下一页">→</button></div>
  </div>
  <aside class="download-detail" id="download-detail"><h2>任务详情</h2></aside>
</section>
<dialog id="download-dialog"><form id="download-form"><div id="download-dialog-body"></div><p id="dialog-error" class="download-error" role="alert"></p><div class="dialog-actions"><button type="button" id="dialog-cancel">取消</button><button class="primary" id="dialog-submit" type="submit">确认</button></div></form></dialog>

<script>
const $ = (id) => document.getElementById(id);
let MODE = 'comic';
let SOURCES = { comic: [], resource: [] };
let CURRENT = { source: null, comic: null, chapter: null };

const DMHY_CATEGORIES = [
  ['', '全部分类'], ['動畫', '動畫'], ['漫畫', '漫畫'], ['音樂', '音樂'], ['日劇', '日劇'],
  ['ＲＡＷ', 'ＲＡＷ'], ['遊戲', '遊戲'], ['特攝', '特攝'], ['季度全集', '季度全集'],
  ['港台原版', '港台原版'], ['日文原版', '日文原版'], ['動漫音樂', '動漫音樂'],
];

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function log(status, ms, text, cls){
  const el = document.createElement('div');
  el.className = cls || '';
  el.innerHTML = `<span class="${status>=500?'s5':status>=400?'s4':'s2'}">${status||'ERR'}</span> ${ms}ms · ${esc(text)}`;
  $('log').prepend(el);
}

async function api(path, opts){
  const t0 = performance.now();
  try {
    const r = await fetch(path, opts);
    const ms = Math.round(performance.now() - t0);
    let body = null;
    try { body = await r.json(); } catch(e){}
    log(r.status, ms, decodeURIComponent(path));
    if (!r.ok) throw new Error((body && (body.detail || body.message)) || ('HTTP ' + r.status));
    return body;
  } catch (e) {
    if (!(e instanceof Error && /HTTP \d|detail/.test(e.message))) log('ERR', Math.round(performance.now()-t0), path, 's5');
    throw e;
  }
}

const imgProxy = (source, url) => `/api/${source}/image?url=${encodeURIComponent(url)}`;
const spinner = () => '<p class="muted"><span class="spinner"></span> 加载中…</p>';
const fail = (e) => `<p style="color:var(--err)">出错：${esc(e.message)}</p>`;

async function boot(){
  try{
    const h = await api('/healthz');
    $('status').textContent = `后端正常 · ${h.sources.length} 漫画源 / ${h.resource_sources.length} 资源源`;
    $('status').className = 'badge ok';
    $('proxybadge').textContent = h.proxy_enabled ? '代理 已启用' : '代理 未配置';
    $('proxybadge').className = 'badge ' + (h.proxy_enabled ? 'ok' : 'warn');
    $('hint').textContent = h.proxy_enabled ? '' : '拷贝漫画与 dmhy 建议配置 JUJUBE_PROXY';
  }catch(e){
    $('status').textContent = '后端不可达';
    $('status').className = 'badge warn';
  }
  SOURCES.comic = await api('/api/sources');
  SOURCES.resource = await api('/api/resources');
  fillSources();
}

function fillSources(){
  const list = SOURCES[MODE];
  $('source').innerHTML = list.map(s =>
    `<option value="${esc(s.key)}">${esc(s.name)} (${esc(s.key)})${s.needs_proxy ? ' · 需代理' : s.prefer_proxy ? ' · 优先代理' : ''}</option>`
  ).join('');
  $('category').style.display = MODE === 'resource' && $('source').value === 'dmhy' ? '' : 'none';
  $('q').placeholder = MODE === 'comic' ? '关键词，例如：海贼王 / 火影' : '资源关键词，例如：海贼王 / SweetSub';
}

function fillCategories(){
  const isDmhy = MODE === 'resource' && $('source').value === 'dmhy';
  $('category').style.display = isDmhy ? '' : 'none';
  if (isDmhy) $('category').innerHTML = DMHY_CATEGORIES.map(([v,l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
}

function setMode(mode){
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.querySelector(`nav button[data-mode="${mode}"]`).classList.add('active');
  MODE = mode;
  $('search-controls').hidden = mode === 'downloads';
  $('browse-main').hidden = mode === 'downloads';
  $('downloads-view').hidden = mode !== 'downloads';
  if(mode === 'downloads'){ loadDownloads(); connectDownloads(); return; }
  if(DOWNLOADS.events){ DOWNLOADS.events.close(); DOWNLOADS.events = null; }
  $('results').innerHTML = '';
  $('q').value = '';
  fillSources(); fillCategories();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

$('source').onchange = fillCategories;
$('clearlog').onclick = () => $('log').innerHTML = '';
$('go').onclick = () => MODE === 'comic' ? searchComic() : searchResource();
$('latest').onclick = () => MODE === 'comic' ? latestComic() : latestResource();
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });

// ---------- 漫画 ----------
async function searchComic(){
  const src = $('source').value, q = $('q').value.trim(), page = $('page').value || 1;
  if (!q) return;
  $('results').innerHTML = spinner();
  try{
    const d = await api(`/api/${src}/search?q=${encodeURIComponent(q)}&page=${page}`);
    renderComics(d);
  }catch(e){ $('results').innerHTML = fail(e); }
}

async function latestComic(){
  const src = $('source').value, page = $('page').value || 1;
  $('results').innerHTML = spinner();
  try{
    const d = await api(`/api/${src}/latest?page=${page}`);
    renderComics(d, '最近更新');
  }catch(e){ $('results').innerHTML = fail(e); }
}

function renderComics(d, title){
  if (!d.items.length) return $('results').innerHTML = '<p class="muted">没有结果。</p>';
  $('results').innerHTML = `
    <h2>${esc(title || `搜索「${d.keyword}」`)} <span class="muted">· ${esc(d.source)} · ${d.count} 条</span></h2>
    <div class="grid">${d.items.map((it, i) => `
      <div class="card" data-i="${i}">
        <img loading="lazy" src="${it.cover ? esc(imgProxy(d.source, it.cover)) : ''}"
             onerror="this.onerror=null;this.src='${it.cover ? esc(it.cover) : ''}'">
        <div class="t">${esc(it.title)}</div>
        <div class="s">${esc(it.status || '')}</div>
      </div>`).join('')}
    </div>`;
  $('results').querySelectorAll('.card').forEach(card => {
    card.onclick = () => openComic(d.source, d.items[+card.dataset.i]);
  });
}

async function openComic(source, item){
  CURRENT.source = source;
  $('results').innerHTML = spinner();
  try{
    const det = await api(`/api/${source}/comic/${encodeURIComponent(item.id)}`);
    CURRENT.comic = det;
    const groups = {};
    det.chapters.forEach(c => (groups[c.group] = groups[c.group] || []).push(c));
    $('results').innerHTML = `
      <h2>${esc(det.title)} <span class="muted">· ${esc(source)} · ${det.chapters.length} 章</span></h2>
      <div style="display:flex;gap:14px;align-items:flex-start">
        ${det.cover ? `<img src="${esc(imgProxy(source, det.cover))}" style="width:132px;border-radius:8px" onerror="this.onerror=null;this.src='${esc(det.cover)}'">` : ''}
        <div>
          ${Object.entries(det.tags || {}).map(([k,v]) =>
            `<div class="row"><span class="k">${esc(k)}</span><span>${v.map(esc).join('、')}</span></div>`).join('')}
          <div class="row"><span class="k">更新时间</span><span>${esc(det.update_time || '-')}</span></div>
          ${det.description ? `<div class="row"><span class="k">简介</span><span>${esc(det.description)}</span></div>` : ''}
        </div>
      </div>
      ${Object.entries(groups).map(([g, list], groupIndex) => `
        <h3>${esc(g)} · ${list.length} 章 <button data-download-group="${groupIndex}">下载章节组</button></h3>
        <div>${list.map(c => `<span class="chap" data-id="${esc(c.id)}">${esc(c.title || c.id)}</span>`).join('')}</div>
      `).join('')}
      <p><button id="back">← 返回结果</button></p>`;
    $('back').onclick = () => searchComic();
    $('results').querySelectorAll('[data-download-group]').forEach(button => {
      button.onclick = () => createBatchDialog(source, det.id, Object.keys(groups)[+button.dataset.downloadGroup]);
    });
    $('results').querySelectorAll('.chap').forEach(el => {
      el.onclick = () => openChapter(source, det.id, el.dataset.id, el.textContent);
    });
  }catch(e){ $('results').innerHTML = fail(e); }
}

async function openChapter(source, comicId, chapterId, title){
  CURRENT.chapter = chapterId;
  $('results').innerHTML = spinner();
  try{
    const d = await api(`/api/${source}/comic/${encodeURIComponent(comicId)}/chapter/${encodeURIComponent(chapterId)}`);
    $('results').innerHTML = `
      <h2>${esc(d.title || title)} <span class="muted">· ${d.count} 页</span></h2>
      <div class="download-toolbar"><button class="primary" id="download-chapter">下载本章</button><button id="download-chapter-group">下载章节组</button></div>
      <div class="pages">${d.images.map((u, i) =>
        `<img loading="lazy" src="${esc(imgProxy(source, u))}" alt="p${i+1}">`).join('')}</div>
      <p><button id="back">← 返回章节列表</button></p>`;
    $('back').onclick = () => openComic(source, {id: comicId});
    $('download-chapter').onclick = () => createDownloadDialog({type:'comic_chapter',source,
      source_id:`comic-${comicId}/chapter-${chapterId}`,comic_id:comicId,chapter_id:chapterId,
      title:`${CURRENT.comic?.title || comicId} ${d.title || title}`,output_format:'cbz'});
    const chapterGroup = CURRENT.comic?.chapters.find(c => c.id === chapterId)?.group;
    $('download-chapter-group').hidden = !chapterGroup;
    $('download-chapter-group').onclick = () => createBatchDialog(source, comicId, chapterGroup);
  }catch(e){ $('results').innerHTML = fail(e); }
}

// ---------- 资源 ----------
async function searchResource(){
  const src = $('source').value, q = $('q').value.trim(), page = $('page').value || 1;
  if (!q) return;
  $('results').innerHTML = spinner();
  try{
    const cat = $('category').value;
    const d = await api(`/api/resources/${src}/search?q=${encodeURIComponent(q)}&page=${page}` + (cat ? `&category=${encodeURIComponent(cat)}` : ''));
    renderResources(d, `搜索「${d.keyword}」`);
  }catch(e){ $('results').innerHTML = fail(e); }
}

async function latestResource(){
  const src = $('source').value, page = $('page').value || 1;
  $('results').innerHTML = spinner();
  try{
    const cat = $('category').value;
    const d = await api(`/api/resources/${src}/latest?page=${page}` + (cat ? `&category=${encodeURIComponent(cat)}` : ''));
    renderResources(d, '最新发布');
  }catch(e){ $('results').innerHTML = fail(e); }
}

function renderResources(d, title){
  if (!d.items.length) return $('results').innerHTML = '<p class="muted">没有结果。</p>';
  $('results').innerHTML = `
    <h2>${esc(title)} <span class="muted">· ${esc(d.source)} · ${d.count} 条</span></h2>
    ${d.items.map((it, i) => `
      <div class="res">
        <div class="title">${esc(it.title)}</div>
        <div class="meta">
          <span>${esc(it.category || '-')}</span><span>${esc(it.size || '-')}</span>
          <span>${esc(it.published_at || '-')}</span>
          ${it.publisher ? `<span>${esc(it.publisher)}</span>` : ''}
          ${it.seeders ? `<span>做种 ${esc(it.seeders)}</span>` : ''}
        </div>
        <div class="acts">
          <button class="primary" data-detail="${i}">详情 / 种子</button>
          ${it.magnet ? `<button data-copy="${i}">复制磁力</button>` : ''}
          ${it.magnet ? `<a href="${esc(it.magnet)}">磁力链接</a>` : ''}
        </div>
        <details><summary>原始字段</summary><code>${esc(JSON.stringify({id: it.id, magnet: it.magnet}))}</code></details>
      </div>`).join('')}`;

  $('results').querySelectorAll('[data-detail]').forEach(b => b.onclick = () => openResource(d.source, d.items[+b.dataset.detail]));
  $('results').querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(d.items[+b.dataset.copy].magnet); b.textContent = '已复制 ✓'; }
    catch(e){ b.textContent = '复制失败'; }
  });
}

async function openResource(source, item){
  $('results').innerHTML = spinner();
  try{
    const d = await api(`/api/resources/${source}/item/${encodeURIComponent(item.id)}`);
    $('results').innerHTML = `
      <h2>${esc(d.title)}</h2>
      <div class="row"><span class="k">分类</span><span>${esc(d.category || '-')}</span></div>
      <div class="row"><span class="k">大小</span><span>${esc(d.size || '-')}</span></div>
      <div class="row"><span class="k">发布</span><span>${esc(d.published_at || '-')}</span></div>
      <div class="row"><span class="k">磁力</span><span><a href="${esc(d.magnet || '#')}">${esc((d.magnet || '无').slice(0, 72))}…</a></span></div>
      <div class="row"><span class="k">种子</span><span>${d.torrent ? `<a href="${esc(d.torrent)}">${esc(d.torrent)}</a>` : '无'}</span></div>
      ${d.torrent ? '<p><button class="primary" id="download-torrent">下载 .torrent</button></p>' : ''}
      <h3>文件 ${d.files.length} 个</h3>
      ${d.files.map(f => `<div class="row"><span>${esc(f.name)}</span><span class="muted" style="margin-left:auto">${esc(f.size || '')}</span></div>`).join('')}
      <p><button id="back">← 返回结果</button></p>`;
    $('back').onclick = () => searchResource();
    if($('download-torrent')) $('download-torrent').onclick = () => createDownloadDialog({type:'torrent',source,
      source_id:d.id,title:d.title,torrent_url:d.torrent,output_format:'file'});
  }catch(e){ $('results').innerHTML = fail(e); }
}

// ---------- 下载管理 ----------
const DOWNLOADS = {groups:[],items:[],group:'',page:1,total:0,selected:new Set(),detail:null,events:null,timer:null,loading:false,again:false};
const STATUS_NAMES = {pending:'待提交',queued:'排队中',downloading:'下载中',paused:'已暂停',completed:'已完成',failed:'失败',canceled:'已取消'};
// Lucide v0.468.0 icon nodes (ISC), vendored for offline use. See web/LUCIDE-LICENSE.
const ICONS = {
  pause:[['rect',{x:'14',y:'4',width:'4',height:'16',rx:'1'}],['rect',{x:'6',y:'4',width:'4',height:'16',rx:'1'}]],
  resume:[['polygon',{points:'6 3 20 12 6 21 6 3'}]],
  cancel:[['path',{d:'M18 6 6 18'}],['path',{d:'m6 6 12 12'}]],
  retry:[['path',{d:'M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8'}],['path',{d:'M3 3v5h5'}]],
  delete:[['path',{d:'M3 6h18'}],['path',{d:'M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6'}],['path',{d:'M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2'}],['line',{x1:'10',x2:'10',y1:'11',y2:'17'}],['line',{x1:'14',x2:'14',y1:'11',y2:'17'}]],
  download:[['path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}],['polyline',{points:'7 10 12 15 17 10'}],['line',{x1:'12',x2:'12',y1:'15',y2:'3'}]],
  refresh:[['path',{d:'M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8'}],['path',{d:'M21 3v5h-5'}],['path',{d:'M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16'}],['path',{d:'M8 16H3v5'}]],
  edit:[['path',{d:'M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z'}],['path',{d:'m15 5 4 4'}]],
  add:[['path',{d:'M5 12h14'}],['path',{d:'M12 5v14'}]]
};
function icon(name){return `<svg viewBox="0 0 24 24" aria-hidden="true">${(ICONS[name] || []).map(([tag,attrs])=>`<${tag} ${Object.entries(attrs).map(([key,value])=>`${key}="${esc(value)}"`).join(' ')}></${tag}>`).join('')}</svg>`;}
function bytes(value){if(value == null)return '-'; const units=['B','KB','MB','GB','TB'];let i=0;while(value>=1024 && i<4){value/=1024;i++;}return `${value.toFixed(i?1:0)} ${units[i]}`;}
function duration(value){return value == null ? '-' : value>=3600 ? `${Math.floor(value/3600)}h ${Math.floor(value%3600/60)}m` : value>=60 ? `${Math.floor(value/60)}m ${value%60}s` : `${value}s`;}
function requestJSON(method, data){return {method,headers:{'Content-Type':'application/json'},...(data === undefined?{}:{body:JSON.stringify(data)})};}
function taskActions(task){
  if(task.cleanup_state === 'pending')return [];
  if(task.requested_action === 'cancel')return [];
  if(task.requested_action === 'pause')return ['cancel'];
  return ({pending:['cancel'],queued:['pause','cancel'],downloading:['pause','cancel'],paused:['resume','cancel'],failed:['retry','delete'],canceled:['retry','delete'],completed:['download','delete']})[task.status] || [];
}
const ACTION_NAMES={pause:'暂停',resume:'恢复',cancel:'取消任务',retry:'重试',delete:'删除任务与文件',download:'下载文件'};
function actionButtons(task){return taskActions(task).map(action => action==='download'
  ? `<a class="icon-button" title="${ACTION_NAMES[action]}" aria-label="${ACTION_NAMES[action]}" href="/api/downloads/${encodeURIComponent(task.id)}/content">${icon(action)}</a>`
  : `<button class="icon-button" title="${ACTION_NAMES[action]}" aria-label="${ACTION_NAMES[action]}" data-task="${esc(task.id)}" data-action="${action}">${icon(action)}</button>`).join('');}
function stateName(task){return task.requested_action==='pause'?'正在暂停':task.requested_action==='cancel'?'正在取消':task.cleanup_state==='pending'?'等待清理':STATUS_NAMES[task.status] || task.status;}
function groupOptions(){return '<option value="">未分组</option>'+DOWNLOADS.groups.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('');}
function dialog(body, label, onSubmit){
  $('download-dialog-body').innerHTML = body;
  $('dialog-error').textContent = '';
  $('dialog-submit').textContent = label;
  $('dialog-submit').disabled = false;
  $('download-form').onsubmit = async event => {
    event.preventDefault(); $('dialog-submit').disabled = true;
    try{await onSubmit();$('download-dialog').close();}
    catch(error){$('dialog-error').textContent=error.message;}
    finally{$('dialog-submit').disabled=false;}
  };
  $('download-dialog').showModal();
}
$('dialog-cancel').onclick=()=>$('download-dialog').close();
async function prepareDialog(action){try{DOWNLOADS.groups=await api('/api/download-groups');await action();}catch(error){$('results').insertAdjacentHTML('afterbegin',fail(error));}}
function createDownloadDialog(data){return prepareDialog(()=>dialog(`<h2>创建下载任务</h2><p>${esc(data.title)}</p><label for="task-group">下载分组</label><select id="task-group">${groupOptions()}</select>`,'加入下载',async()=>{
  const task=await api('/api/downloads',requestJSON('POST',{...data,group_id:$('task-group').value || null}));
  DOWNLOADS.detail=task.id;DOWNLOADS.page=1;DOWNLOADS.group='';DOWNLOADS.selected.clear();setMode('downloads');
}));}
function createBatchDialog(source, comicId, group){return prepareDialog(async()=>{
  const preview=await api(`/api/download-batches/preview?source=${encodeURIComponent(source)}&comic_id=${encodeURIComponent(comicId)}&chapter_group=${encodeURIComponent(group)}`);
  dialog(`<h2>下载章节组 · ${esc(group)}</h2><p>共 ${preview.count} 章 · 已有 ${preview.existing_count} 章 · 新增 ${preview.new_count} 章</p><label for="task-group">下载分组</label><select id="task-group">${groupOptions()}</select><div class="preview-list">${preview.items.map(c=>`<div>${esc(c.title)}${c.exists?' · 已有任务':''}</div>`).join('')}</div>`,'确认下载',async()=>{
    await api('/api/downloads/batch',requestJSON('POST',{source,comic_id:comicId,chapter_group:group,group_id:$('task-group').value || null,output_format:'cbz'}));
    DOWNLOADS.detail=null;DOWNLOADS.page=1;DOWNLOADS.group='';DOWNLOADS.selected.clear();setMode('downloads');
  });
});}
function editGroup(group){
  dialog(`<h2>${group?'编辑分组':'新建分组'}</h2><label for="group-name">名称</label><input id="group-name" required maxlength="100" value="${esc(group?.name || '')}"><label for="group-description">备注</label><textarea id="group-description" maxlength="2000">${esc(group?.description || '')}</textarea><label for="group-path">保存子目录</label><input id="group-path" value="${esc(group?.save_path || '')}">`,'保存',async()=>{
    await api('/api/download-groups'+(group?'/'+encodeURIComponent(group.id):''),requestJSON(group?'PATCH':'POST',{name:$('group-name').value,description:$('group-description').value,save_path:$('group-path').value || null}));
    await loadDownloads();
  });
}
function renderGroups(){
  const choices=[{id:'',name:'全部任务'},{id:'ungrouped',name:'未分组'},...DOWNLOADS.groups];
  $('download-groups').innerHTML=choices.map(g=>`<button data-group="${esc(g.id)}" class="${DOWNLOADS.group===g.id?'selected':''}">${esc(g.name)}</button>`).join('')+`<button id="new-download-group">${icon('add')} 新建分组</button>`;
  $('download-groups').querySelectorAll('[data-group]').forEach(button=>button.onclick=()=>{DOWNLOADS.group=button.dataset.group;DOWNLOADS.page=1;DOWNLOADS.selected.clear();loadDownloads();});
  $('new-download-group').onclick=()=>editGroup();
  const selected=DOWNLOADS.groups.find(g=>g.id===DOWNLOADS.group);
  if(selected){
    $('download-groups').insertAdjacentHTML('beforeend',`<div class="download-actions" style="margin-top:12px"><button id="edit-download-group" class="icon-button" title="编辑分组" aria-label="编辑分组">${icon('edit')}</button><button id="delete-download-group" class="icon-button" title="删除分组" aria-label="删除分组">${icon('delete')}</button></div>`);
    $('edit-download-group').onclick=()=>editGroup(selected);
    $('delete-download-group').onclick=()=>dialog(`<h2>删除分组</h2><p>${esc(selected.name)}</p><p>关联任务转为未分组，文件保留。</p>`,'删除分组',async()=>{await api('/api/download-groups/'+encodeURIComponent(selected.id),{method:'DELETE'});DOWNLOADS.group='';await loadDownloads();});
  }
}
function renderTasks(data){
  DOWNLOADS.items=data.items;DOWNLOADS.total=data.total;
  $('download-summary').innerHTML=['downloading','queued','completed','failed'].map(s=>`<span>${STATUS_NAMES[s]} <strong>${data.counts[s] || 0}</strong></span>`).join('');
  $('download-rows').innerHTML=data.items.length?data.items.map(t=>`<tr class="${DOWNLOADS.detail===t.id?'selected':''}"><td><input type="checkbox" data-select-task="${esc(t.id)}" aria-label="选择 ${esc(t.title)}" ${DOWNLOADS.selected.has(t.id)?'checked':''}></td><td class="task-title"><button class="task-link" data-detail-task="${esc(t.id)}">${esc(t.title)}</button><div class="muted">${esc(t.source)} · ${t.type==='torrent'?'种子文件':'CBZ'}</div></td><td>${esc(DOWNLOADS.groups.find(g=>g.id===t.group_id)?.name || '未分组')}</td><td>${esc(stateName(t))}</td><td><progress value="${t.progress}" max="100" aria-label="下载进度"></progress>${t.progress.toFixed(1)}% · ${t.completed_files}/${t.file_count}</td><td>${t.speed?bytes(t.speed)+'/s':'-'}<div class="muted">${duration(t.eta)}</div></td><td><div class="download-actions">${actionButtons(t)}</div></td></tr>`).join(''):'<tr><td colspan="7" class="muted">暂无任务</td></tr>';
  $('download-page').textContent=`第 ${data.page} / ${Math.max(1,Math.ceil(data.total/data.page_size))} 页 · ${data.total} 项`;
  $('download-prev').disabled=data.page<=1;$('download-next').disabled=data.page*data.page_size>=data.total;
  $('select-all-tasks').checked=data.items.length>0 && data.items.every(t=>DOWNLOADS.selected.has(t.id));
  $('download-rows').querySelectorAll('[data-select-task]').forEach(input=>input.onchange=()=>{input.checked?DOWNLOADS.selected.add(input.dataset.selectTask):DOWNLOADS.selected.delete(input.dataset.selectTask);renderBulk();});
  $('download-rows').querySelectorAll('[data-detail-task]').forEach(button=>button.onclick=()=>{DOWNLOADS.detail=button.dataset.detailTask;renderTasks(data);loadDownloadDetail().then(()=>{if(matchMedia('(max-width:1200px)').matches)$('download-detail').scrollIntoView({behavior:'smooth',block:'start'});});});
  wireActions($('download-rows'));renderBulk();
}
function renderBulk(){
  const allSelected=DOWNLOADS.items.length>0 && DOWNLOADS.items.every(t=>DOWNLOADS.selected.has(t.id));
  $('bulk-actions').innerHTML=`<label class="muted"><input type="checkbox" data-bulk-select-all aria-label="选择本页任务" ${allSelected?'checked':''} ${DOWNLOADS.items.length?'':'disabled'}> 本页</label><span class="muted">已选 ${DOWNLOADS.selected.size} 项</span>`+['pause','resume','cancel'].map(action=>`<button data-bulk="${action}" ${DOWNLOADS.selected.size?'':'disabled'}>${icon(action)} ${ACTION_NAMES[action]}</button>`).join('');
  $('bulk-actions').querySelector('[data-bulk-select-all]').onchange=event=>selectAllTasks(event.target.checked);
  $('bulk-actions').querySelectorAll('svg').forEach(svg=>{svg.style.width='14px';svg.style.height='14px';svg.style.verticalAlign='middle';svg.style.fill='none';svg.style.stroke='currentColor';svg.style.strokeWidth='2';});
  $('bulk-actions').querySelectorAll('[data-bulk]').forEach(button=>button.onclick=async()=>{
    button.disabled=true;let failures=[];
    for(const task of DOWNLOADS.items.filter(t=>DOWNLOADS.selected.has(t.id) && taskActions(t).includes(button.dataset.bulk))){
      try{await api(`/api/downloads/${encodeURIComponent(task.id)}/${button.dataset.bulk}`,{method:'POST'});}catch(error){failures.push(`${task.title}: ${error.message}`);}
    }
    DOWNLOADS.selected.clear();await loadDownloads();$('download-message').textContent=failures.join('; ');
  });
}
function wireActions(container){container.querySelectorAll('[data-action]').forEach(button=>button.onclick=async()=>{
  const id=button.dataset.task,action=button.dataset.action;
  const perform=async()=>{await api('/api/downloads/'+encodeURIComponent(id)+(action==='delete'?'':'/'+action),{method:action==='delete'?'DELETE':'POST'});if(action==='delete' && DOWNLOADS.detail===id)DOWNLOADS.detail=null;DOWNLOADS.selected.delete(id);await loadDownloads();};
  if(action==='delete'){dialog('<h2>删除任务</h2><p>此任务的已下载文件和临时文件将一并删除。</p>','删除',perform);return;}
  button.disabled=true;try{await perform();}catch(error){$('download-message').textContent=error.message;button.disabled=false;}
});}
async function loadDownloadDetail(){
  if(!DOWNLOADS.detail){$('download-detail').innerHTML='<h2>任务详情</h2>';return;}
  const id=DOWNLOADS.detail;
  try{
    const [task,files]=await Promise.all([api('/api/downloads/'+encodeURIComponent(id)),api('/api/downloads/'+encodeURIComponent(id)+'/files')]);
    if(DOWNLOADS.detail!==id)return;
    $('download-detail').innerHTML=`<h2>${esc(task.title)}</h2><p class="muted">${esc(stateName(task))} · ${esc(task.source)}</p><div class="download-actions">${actionButtons(task)}</div><p>${bytes(task.downloaded_bytes)} / ${bytes(task.total_bytes)}</p><div class="download-error">${esc(task.error_message || '')}</div><p class="muted">重试 ${task.retry_count} 次</p><h3>文件 ${files.length}</h3><ul class="detail-files">${files.map(f=>`<li>${esc(f.name)}<div class="muted">${f.status==='completed'?'已完成':'未完成'} · ${bytes(f.size ?? f.downloaded_bytes)}</div></li>`).join('')}</ul>`;
    wireActions($('download-detail'));
  }catch(error){if(DOWNLOADS.detail===id)$('download-detail').innerHTML=fail(error);}
}
async function loadDownloads(){
  if(DOWNLOADS.loading){DOWNLOADS.again=true;return;}
  DOWNLOADS.loading=true;
  try{
    const params=new URLSearchParams({page:DOWNLOADS.page,page_size:25});
    if(DOWNLOADS.group)params.set('group_id',DOWNLOADS.group);
    if($('download-status').value)params.set('status',$('download-status').value);
    if($('download-type').value)params.set('type',$('download-type').value);
    const [groups,data]=await Promise.all([api('/api/download-groups'),api('/api/downloads?'+params)]);
    DOWNLOADS.groups=groups;
    if(data.total && DOWNLOADS.page>Math.ceil(data.total/25)){DOWNLOADS.page=Math.ceil(data.total/25);DOWNLOADS.again=true;return;}
    $('download-message').textContent='';renderGroups();renderTasks(data);await loadDownloadDetail();
  }catch(error){$('download-message').textContent=error.message;}
  finally{DOWNLOADS.loading=false;if(DOWNLOADS.again){DOWNLOADS.again=false;loadDownloads();}}
}
function connectDownloads(){
  if(DOWNLOADS.events)return;
  const events=new EventSource('/api/downloads/events');DOWNLOADS.events=events;
  events.onopen=()=>{$('download-connection').textContent='实时连接';loadDownloads();};
  events.onerror=()=>{$('download-connection').textContent='重新连接中';};
  ['download.created','download.updated','download.completed','download.failed','download.deleted'].forEach(type=>events.addEventListener(type,()=>{
    if(DOWNLOADS.timer)return;
    DOWNLOADS.timer=setTimeout(()=>{DOWNLOADS.timer=null;if(MODE==='downloads')loadDownloads();},300);
  }));
}
$('download-status').onchange=$('download-type').onchange=()=>{DOWNLOADS.page=1;DOWNLOADS.selected.clear();loadDownloads();};
$('download-refresh').innerHTML=icon('refresh');$('download-refresh').onclick=loadDownloads;
$('download-prev').onclick=()=>{DOWNLOADS.page--;DOWNLOADS.selected.clear();loadDownloads();};
$('download-next').onclick=()=>{DOWNLOADS.page++;DOWNLOADS.selected.clear();loadDownloads();};
function selectAllTasks(checked){DOWNLOADS.items.forEach(t=>checked?DOWNLOADS.selected.add(t.id):DOWNLOADS.selected.delete(t.id));$('select-all-tasks').checked=checked;$('download-rows').querySelectorAll('[data-select-task]').forEach(input=>input.checked=checked);renderBulk();}
$('select-all-tasks').onchange=()=>selectAllTasks($('select-all-tasks').checked);
window.addEventListener('pagehide',()=>DOWNLOADS.events?.close());

boot();
</script>
